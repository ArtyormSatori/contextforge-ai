<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052CC"/>
      <stop offset="100%" stop-color="#0747A6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C7E6"/>
      <stop offset="100%" stop-color="#36B37E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#091E42" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- App Background Plate -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Graph Connection Lines -->
  <line x1="64" y1="36" x2="36" y2="76" stroke="#4C9AFF" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 0"/>
  <line x1="64" y1="36" x2="92" y2="76" stroke="#4C9AFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="36" y1="76" x2="92" y2="76" stroke="#4C9AFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="64" y1="36" x2="64" y2="94" stroke="#00C7E6" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3"/>

  <!-- Graph Nodes -->
  <!-- Top Node: Jira Ticket Context -->
  <circle cx="64" cy="36" r="10" fill="#FFFFFF"/>
  <circle cx="64" cy="36" r="6" fill="#0052CC"/>
  
  <!-- Bottom Left Node: Confluence Specs -->
  <circle cx="36" cy="76" r="9" fill="#FFFFFF"/>
  <circle cx="36" cy="76" r="5" fill="#00C7E6"/>
  
  <!-- Bottom Right Node: Bitbucket PRs -->
  <circle cx="92" cy="76" r="9" fill="#FFFFFF"/>
  <circle cx="92" cy="76" r="5" fill="#36B37E"/>

  <!-- Central Intelligence Core (Rovo AI Spark) -->
  <circle cx="64" cy="66" r="12" fill="url(#glowGrad)"/>
  <polygon points="64,58 67,64 73,66 67,68 64,74 61,68 55,66 61,64" fill="#FFFFFF"/>

  <!-- Lower Terminal Connector: MCP Engine -->
  <circle cx="64" cy="94" r="6" fill="#FFAB00"/>
  <circle cx="64" cy="94" r="3" fill="#FFFFFF"/>
</svg>
